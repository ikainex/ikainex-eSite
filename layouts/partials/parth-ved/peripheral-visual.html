{{ $type := .type }}
<figure class="lin-diagram peripheral-visual"><figcaption>{{ .title }}</figcaption>
  {{ if eq $type "flow" }}
    <div class="lin-flow-diagram" role="img" aria-label="{{ .title }}">{{ range $index, $step := .steps }}{{ if $index }}<span class="lin-flow-arrow" aria-hidden="true">→</span>{{ end }}<span class="lin-flow-step">{{ $step }}</span>{{ end }}</div>
  {{ else if eq $type "can-bus" }}
    <svg viewBox="0 0 720 205" role="img" aria-label="CAN nodes connected to a differential two-wire bus"><path class="lin-wire" d="M70 83H650M70 105H650M170 83v22m190-22v22m190-22v22"/><circle class="lin-master" cx="170" cy="94" r="28"/><circle class="lin-node" cx="360" cy="94" r="28"/><circle class="lin-node" cx="550" cy="94" r="28"/><text x="170" y="98" text-anchor="middle">ECU A</text><text x="360" y="98" text-anchor="middle">ECU B</text><text x="550" y="98" text-anchor="middle">ECU C</text><text class="lin-bus-label" x="360" y="57" text-anchor="middle">CAN_H / CAN_L · DIFFERENTIAL PAIR</text><text x="70" y="75">120 Ω</text><text x="650" y="75" text-anchor="end">120 Ω</text><path d="M70 83v22m580-22v22" stroke="#d18935" stroke-width="4"/></svg>
  {{ else if eq $type "cxpi-bus" }}
    <svg viewBox="0 0 720 205" role="img" aria-label="CXPI master and body electronics nodes connected by one bus wire"><path class="lin-wire" d="M100 105H620"/><circle class="lin-master" cx="150" cy="105" r="38"/><circle class="lin-node" cx="330" cy="105" r="30"/><circle class="lin-node" cx="490" cy="105" r="30"/><circle class="lin-node" cx="620" cy="105" r="30"/><text x="150" y="101" text-anchor="middle">MASTER</text><text x="150" y="117" text-anchor="middle">ECU</text><text x="330" y="109" text-anchor="middle">Switch</text><text x="490" y="109" text-anchor="middle">Panel</text><text x="620" y="109" text-anchor="middle">Seat</text><text class="lin-bus-label" x="390" y="68" text-anchor="middle">SHARED SINGLE-WIRE BUS</text></svg>
  {{ else if eq $type "spi-bus" }}
    <svg viewBox="0 0 720 230" role="img" aria-label="SPI host and target connected by clock, two data lines and chip select"><rect class="visual-box" x="35" y="48" width="175" height="130" rx="18"/><rect class="visual-box visual-target" x="510" y="62" width="170" height="100" rx="18"/><text x="122" y="112" text-anchor="middle">MCU · HOST</text><text x="122" y="134" text-anchor="middle">SPI controller</text><text x="595" y="108" text-anchor="middle">SENSOR</text><text x="595" y="130" text-anchor="middle">TARGET</text><path class="visual-wire" d="M210 76H510M210 105H510M210 134H510M210 163H510"/><text class="visual-wire-label" x="360" y="70" text-anchor="middle">SCK · CLOCK</text><text class="visual-wire-label" x="360" y="99" text-anchor="middle">MOSI · HOST → TARGET</text><text class="visual-wire-label" x="360" y="128" text-anchor="middle">MISO · TARGET → HOST</text><text class="visual-wire-label" x="360" y="157" text-anchor="middle">CS · SELECT</text></svg>
  {{ else if eq $type "uart-frame" }}
    <svg viewBox="0 0 720 205" role="img" aria-label="UART transmit and receive wires cross between two devices"><rect class="visual-box" x="35" y="38" width="170" height="125" rx="18"/><rect class="visual-box visual-target" x="515" y="38" width="170" height="125" rx="18"/><text x="120" y="82" text-anchor="middle">DEVICE A</text><text x="600" y="82" text-anchor="middle">DEVICE B</text><path class="visual-wire" d="M205 90H515M515 125H205M205 155H515"/><text class="visual-wire-label" x="360" y="83" text-anchor="middle">TX → RX</text><text class="visual-wire-label" x="360" y="120" text-anchor="middle">RX ← TX</text><text class="visual-wire-label" x="360" y="150" text-anchor="middle">COMMON GROUND</text><text class="lin-bus-label" x="360" y="190" text-anchor="middle">NO SHARED CLOCK · AGREE ON BAUD RATE</text></svg>
  {{ else if eq $type "i2c-bus" }}
    <svg viewBox="0 0 720 220" role="img" aria-label="I2C controller and two addressed targets sharing clock and data lines"><path class="visual-wire" d="M90 82H640M90 112H640"/><text class="visual-wire-label" x="360" y="72" text-anchor="middle">SCL · CLOCK</text><text class="visual-wire-label" x="360" y="103" text-anchor="middle">SDA · DATA</text><rect class="visual-box" x="30" y="132" width="150" height="64" rx="14"/><rect class="visual-box visual-target" x="270" y="132" width="140" height="64" rx="14"/><rect class="visual-box visual-target" x="500" y="132" width="140" height="64" rx="14"/><path class="visual-branch" d="M105 112v20m235-20v20m235-20v20"/><text x="105" y="159" text-anchor="middle">CONTROLLER</text><text x="340" y="159" text-anchor="middle">TARGET 0x48</text><text x="570" y="159" text-anchor="middle">TARGET 0x68</text><text class="lin-bus-label" x="360" y="25" text-anchor="middle">PULL-UP RESISTORS ON SDA AND SCL</text></svg>
  {{ else if eq $type "gpio-pins" }}
    <svg viewBox="0 0 720 220" role="img" aria-label="Microcontroller GPIO pins read a button and control an LED"><rect class="visual-box" x="255" y="42" width="210" height="138" rx="18"/><text x="360" y="74" text-anchor="middle">MICROCONTROLLER</text><text x="360" y="97" text-anchor="middle">GPIO pins</text><path class="visual-wire" d="M255 120H110M465 145H610"/><circle class="lin-node" cx="110" cy="120" r="25"/><circle class="lin-master" cx="610" cy="145" r="25"/><text x="110" y="124" text-anchor="middle">IN</text><text x="610" y="149" text-anchor="middle">OUT</text><text class="visual-wire-label" x="180" y="111" text-anchor="middle">BUTTON</text><text class="visual-wire-label" x="535" y="134" text-anchor="middle">LED</text><text class="lin-bus-label" x="360" y="207" text-anchor="middle">READ AN INPUT · DRIVE A LOGIC-LEVEL OUTPUT</text></svg>
  {{ end }}
  <p class="lin-figure-note">{{ .caption }}</p>
</figure>
