<style>
  @media (min-width: 768px) and (hover: hover) and (pointer: fine) {
    html { zoom: 0.8; }
  }
</style>
<script>
  if (Math.min(screen.width, screen.height) < 768 && matchMedia("(any-pointer: coarse)").matches) {
    document.querySelector('meta[name="viewport"]').content = "width=device-width, initial-scale=0.6";
  }
</script>
